shape: flat
shape_note: |-
  There is no entity-relationship graph to draw. The v2 API exposes no persisted resources —
  no customers, no lists, no jobs, no stored verifications — so there are no ids, no id
  prefixes, no `$ref` chains between domain objects and no has_one/has_many edges. The data
  model is a single computed value object returned by a single operation, plus a three-field
  error envelope that shares two of its field names.

  This is worth stating explicitly rather than omitting: a caller who expects to fetch a prior
  verification by id, page a history, or reconcile a batch will find no surface for it. Every
  result is ephemeral and must be persisted client-side.
