relationships: []
relationships_note: >-
  None. `VerificationResult` and `Error` share the field names `status`, `event` and `details`
  but are not related by `$ref`, allOf, or discriminator — they are two independent schemas
  with an overlapping surface. That overlap is the only structural coupling in the model, and
  it is the reason a client cannot tell success from failure by shape alone.
derived_facets:
  note: >-
    The seven boolean flags are independent classifications computed over the same address, not
    sub-entities. `isDisposable` and `isFreeService` are mutually informative but not mutually
    exclusive in the schema; `possibleSpamtrap` and `isComplainer` are reputation signals rather
    than deliverability signals and may be true on an address whose `status` is `passed`.
