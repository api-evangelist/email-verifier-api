      x-agent-hazards:
        - >-
          A 200 OK does not mean the address is deliverable. Branch on `status`
          (passed|failed|unknown|transient) and then on `event`, never on the HTTP status alone.
        - >-
          The API key is a QUERY parameter and is written to any intermediary access log.
          Prefer the POST form and rotate keys that may have been logged.
        - >-
          Format is selected with `?xml=true`, not with an `Accept` header. Content negotiation
          is ignored.
        - >-
          There is no idempotency key and no de-duplication. A blind retry of a Paid event is
          billed a second time; cache results client-side keyed on the normalized address.
