tools:
  - name: verify_email
    description: >-
      Run the 16-point verification engine against a single email address and return the
      deliverability verdict (status), the granular event code, a human-readable explanation,
      and the intelligence flags (disposable, role account, free service, spam-trap,
      gibberish, offensive, complainer).
    source_operation: openapi/email-verifier-api-verification-api-openapi.yml#verifyEmailGet
    input_schema_source: >-
      components/parameters/Email + components/parameters/Xml (apiKey is server-side credential,
      not an agent input)
    read_only: true
    metered: true
    metering_note: >-
      Paid events (mailboxExists, mailboxDoesNotExist, mailboxIsFull) consume one credit each.
      Free events (invalidSyntax, domainDoesNotExist, mxServerDoesNotExist, isCatchall,
      isGreylisting, transientError) do not.
  - name: verify_email_post
    description: >-
      Same verification as verify_email but submits the address in a form-encoded request body
      so it does not appear in URL strings or proxy access logs. Preferred for server-to-server
      and agent traffic.
    source_operation: openapi/email-verifier-api-verification-api-openapi.yml#verifyEmailPost
    input_schema_source: requestBody application/x-www-form-urlencoded {email} + parameters/Xml
    read_only: true
    metered: true
